name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: DermaMetric-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Definir versão
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+.*)$') {
            $version = $Matches[1]
          } else {
            $version = "0.0.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $version"

      - name: Build PyInstaller (onedir/windowed)
        shell: pwsh
        run: |
          python -m PyInstaller packaging/dermametric.spec --noconfirm --clean
          if (-not (Test-Path "dist/DermaMetric/DermaMetric.exe")) {
            throw "Executável não gerado pelo PyInstaller"
          }

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Gerar DermaMetric-Setup.exe
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe não encontrado" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "packaging\installer.iss"
          if (-not (Test-Path "dist/installer/DermaMetric-Setup.exe")) {
            throw "Instalador não gerado"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DermaMetric-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/DermaMetric-Setup.exe
          if-no-files-found: error

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/DermaMetric-Setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
