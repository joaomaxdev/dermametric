name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sintaxe do frontend
        run: node --check frontend/app.js

      - name: Suíte de testes
        run: python -m pytest -q -ra --junitxml=pytest-results.xml

      # Os logs de job não são públicos: publica as falhas como anotações do
      # check run para diagnóstico sem depender de autenticação.
      - name: Anotar falhas dos testes
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for report in glob.glob("pytest-results.xml"):
              for case in ET.parse(report).getroot().iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is None:
                          continue
                      lines = (node.get("message") or "").strip().splitlines()
                      detail = lines[0][:180] if lines else kind
                      detail = detail.replace("%", "%25").replace("\r", "")
                      title = f"{case.get('classname')}.{case.get('name')}"
                      print(f"::error title={title}::{detail}")
          PY
